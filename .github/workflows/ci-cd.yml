name: My task CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  Frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend (Vite)
        working-directory: ./frontend
        run: npm run build

  Backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Typecheck Backend (TypeScript)
        working-directory: ./backend
        run: npx tsc --noEmit

  Deploy:
    name: Deploy Application
    needs: [Frontend, Backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ----- 1. PREPARE SECRETS -----
      # Automatically trims any accidental spaces or newlines the user pasted in GitHub Secrets
      - name: Clean Cloudflare Account ID
        run: |
          echo "CLEAN_ACCOUNT_ID=$(echo '${{ secrets.CLOUDFLARE_ACCOUNT_ID }}' | tr -d '\n\r ')" >> $GITHUB_ENV

      # ----- 2. DEPLOY BACKEND (Cloudflare Workers) -----
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Deploy Backend to Cloudflare Workers
        working-directory: ./backend
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLEAN_ACCOUNT_ID }}

      # ----- 2. DEPLOY FRONTEND (Cloudflare Pages) -----
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Deploy Frontend to Cloudflare Pages
        working-directory: ./frontend
        run: npx wrangler pages deploy dist --project-name=mytask-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLEAN_ACCOUNT_ID }}
